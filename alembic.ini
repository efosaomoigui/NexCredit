# =============================================================================
# alembic.ini — Alembic configuration for NexCredit
# =============================================================================
# Place this file at the repo root (or point to it with -c flag).
# The actual migration scripts live in infra/migrations/.

[alembic]
# Path to migration scripts directory (relative to this file)
script_location = infra/migrations

# File format for new migration scripts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file name timestamps
timezone = UTC

# Default database URL — overridden by env var at runtime
# Do NOT put real credentials here. Use environment variable injection in env.py.
sqlalchemy.url = postgresql+asyncpg://nexcredit:changeme@localhost:5433/lending_dev

# Length of truncated revision identifiers
truncate_slug_length = 40

# Allow Alembic to compare server_default values
compare_server_default = true

[post_write_hooks]
# hooks = ruff

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
