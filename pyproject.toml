[tool.ruff]
target-version = "py311"
line-length = 100
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "S",   # flake8-bandit (security)
  "T20", # flake8-print (no bare print statements)
]
ignore = [
  "S101",  # assert is fine in test files
  "S105",  # hardcoded password detection (triggers on placeholder strings)
]
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
  "node_modules",
  "infra/migrations/versions",
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "infra/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["shared", "services"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["shared"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
