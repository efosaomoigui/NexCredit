events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream identity_engine { server identity_engine:8000; }
    upstream lending_engine { server lending_engine:8000; }
    upstream payment_engine { server payment_engine:8000; }
    upstream risk_engine { server risk_engine:8000; }
    upstream notification_engine { server notification_engine:8000; }
    upstream collections_engine { server collections_engine:8000; }
    upstream crm_engine { server crm_engine:8000; }
    upstream compliance_engine { server compliance_engine:8000; }
    upstream ai_engine { server ai_engine:8000; }

    server {
        listen 80;
        server_name localhost;

        # Health Check
        location /health {
            return 200 '{"status": "UP"}';
            add_header Content-Type application/json;
        }

        # API Routes
        location /api/v1/identity/ {
            rewrite ^/api/v1/identity/(.*) /api/v1/$1 break;
            proxy_pass http://identity_engine;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/lending/ {
            rewrite ^/api/v1/lending/(.*) /api/v1/$1 break;
            proxy_pass http://lending_engine;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/payment/ {
            rewrite ^/api/v1/payment/(.*) /api/v1/$1 break;
            proxy_pass http://payment_engine;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/risk/ {
            rewrite ^/api/v1/risk/(.*) /api/v1/$1 break;
            proxy_pass http://risk_engine;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/notifications/ {
            rewrite ^/api/v1/notifications/(.*) /api/v1/$1 break;
            proxy_pass http://notification_engine;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/collections/ {
            rewrite ^/api/v1/collections/(.*) /api/v1/$1 break;
            proxy_pass http://collections_engine;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/crm/ {
            rewrite ^/api/v1/crm/(.*) /api/v1/$1 break;
            proxy_pass http://crm_engine;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/compliance/ {
            rewrite ^/api/v1/compliance/(.*) /api/v1/$1 break;
            proxy_pass http://compliance_engine;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/ai/ {
            rewrite ^/api/v1/ai/(.*) /api/v1/$1 break;
            proxy_pass http://ai_engine;
            include /etc/nginx/proxy_params;
        }
    }
}
