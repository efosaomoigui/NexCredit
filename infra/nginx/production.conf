# NexCredit Production Nginx Configuration
# TLS Termination, Rate Limiting, and Reverse Proxy

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Upstream Services
    upstream identity_engine { server identity_engine:8000; }
    upstream lending_engine { server lending_engine:8000; }
    upstream payment_engine { server payment_engine:8000; }
    upstream risk_engine { server risk_engine:8000; }
    upstream notification_engine { server notification_engine:8000; }
    upstream collections_engine { server collections_engine:8000; }
    upstream crm_engine { server crm_engine:8000; }
    upstream compliance_engine { server compliance_engine:8000; }
    upstream ai_engine { server ai_engine:8000; }

    server {
        listen 80;
        server_name api.nexcredit.ng;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.nexcredit.ng;

        # SSL Configuration (GCP Managed Certificates handled at Load Balancer usually)
        # But for standalone:
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Routes
        location /api/v1/identity/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://identity_engine/api/v1/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/lending/ {
            proxy_pass http://lending_engine/api/v1/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/payment/ {
            proxy_pass http://payment_engine/api/v1/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/risk/ {
            proxy_pass http://risk_engine/api/v1/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/notifications/ {
            proxy_pass http://notification_engine/api/v1/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/collections/ {
            proxy_pass http://collections_engine/api/v1/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/crm/ {
            proxy_pass http://crm_engine/api/v1/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/compliance/ {
            proxy_pass http://compliance_engine/api/v1/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/ai/ {
            proxy_pass http://ai_engine/api/v1/;
            include /etc/nginx/proxy_params;
        }

        # Health Check
        location /health {
            return 200 '{"status": "UP"}';
            add_header Content-Type application/json;
        }
    }
}
